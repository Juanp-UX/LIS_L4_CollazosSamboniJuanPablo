<article class="card h-100 pz-medico-card">
  <img [src]="medico.foto" class="img-fluid border border-bottom doctor-photo" [alt]="medico.nombre">
  <div class="card-body d-flex flex-column">
    <h4 class="h6 mb-1 pz-medico-nombre">{{ medico.nombre }}</h4>
    <p class="small pz-medico-especialidad mb-2">{{ medico.especialidadNombre }}</p>
    <p class="small mb-3">{{ medico.descripcion }}</p>
    <button type="button" class="btn btn-sm mt-auto pz-btn-agendar">
      <i class="bi bi-calendar-check me-1"></i>Agendar cita
    </button>
  </div>
</article>
